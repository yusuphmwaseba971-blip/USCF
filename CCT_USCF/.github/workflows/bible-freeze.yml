name: Bible freeze

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify frozen Bible files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Bible content lock
        run: python3 scripts/verify-bible-freeze.py
